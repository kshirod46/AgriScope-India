<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">AgriScope-India data flow</title>
  <desc id="desc">Inputs flow through calculations, machine learning and API transformations to dashboard outputs.</desc>
  <defs>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#1c654b"/>
      <stop offset="1" stop-color="#d19a3f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d6857"/>
    </marker>
  </defs>
  <rect width="1100" height="470" rx="24" fill="#f7faf8"/>
  <text x="550" y="44" text-anchor="middle" fill="#12372a" font-family="Arial" font-size="25" font-weight="700">From inputs to decisions</text>
  <g font-family="Arial">
    <rect x="42" y="90" width="190" height="106" rx="16" fill="#ffffff" stroke="#d8e5dc"/>
    <text x="137" y="124" text-anchor="middle" fill="#1c654b" font-size="17" font-weight="700">User inputs</text>
    <text x="137" y="151" text-anchor="middle" fill="#607168" font-size="13">crop, area, district</text>
    <text x="137" y="174" text-anchor="middle" fill="#607168" font-size="13">date and history range</text>
    <rect x="272" y="90" width="190" height="106" rx="16" fill="#ffffff" stroke="#d8e5dc"/>
    <text x="367" y="124" text-anchor="middle" fill="#1c654b" font-size="17" font-weight="700">Processing</text>
    <text x="367" y="151" text-anchor="middle" fill="#607168" font-size="13">unit conversion</text>
    <text x="367" y="174" text-anchor="middle" fill="#607168" font-size="13">feature engineering</text>
    <rect x="502" y="90" width="190" height="106" rx="16" fill="#ffffff" stroke="#d8e5dc"/>
    <text x="597" y="124" text-anchor="middle" fill="#1c654b" font-size="17" font-weight="700">Models and APIs</text>
    <text x="597" y="151" text-anchor="middle" fill="#607168" font-size="13">Random Forest</text>
    <text x="597" y="174" text-anchor="middle" fill="#607168" font-size="13">Open-Meteo / Agmarknet</text>
    <rect x="732" y="90" width="190" height="106" rx="16" fill="#ffffff" stroke="#d8e5dc"/>
    <text x="827" y="124" text-anchor="middle" fill="#1c654b" font-size="17" font-weight="700">Validation</text>
    <text x="827" y="151" text-anchor="middle" fill="#607168" font-size="13">source labels</text>
    <text x="827" y="174" text-anchor="middle" fill="#607168" font-size="13">empty/error states</text>
    <rect x="962" y="90" width="96" height="106" rx="16" fill="url(#flow)"/>
    <text x="1010" y="130" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">User</text>
    <text x="1010" y="155" text-anchor="middle" fill="#ffffff" font-size="13">decision</text>
    <text x="1010" y="176" text-anchor="middle" fill="#ffffff" font-size="13">support</text>
  </g>
  <line x1="232" y1="143" x2="272" y2="143" stroke="#3d6857" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="462" y1="143" x2="502" y2="143" stroke="#3d6857" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="692" y1="143" x2="732" y2="143" stroke="#3d6857" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="922" y1="143" x2="962" y2="143" stroke="#3d6857" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="120" y="270" width="860" height="120" rx="18" fill="#edf4ef" stroke="#c7ddd0"/>
  <text x="550" y="306" text-anchor="middle" fill="#12372a" font-family="Arial" font-size="18" font-weight="700">Examples of transparent outputs</text>
  <text x="550" y="334" text-anchor="middle" fill="#607168" font-family="Arial" font-size="14">DAP / Urea / MOP quantity and cost · historical yield estimate with R2 and record count</text>
  <text x="550" y="360" text-anchor="middle" fill="#607168" font-family="Arial" font-size="14">today’s rainfall and seven-day risk · official min / max / modal mandi price</text>
</svg>
